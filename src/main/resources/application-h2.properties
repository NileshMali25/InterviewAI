# ====================================================================
# Embedded H2 Database Profile (For local zero-config runs and testing)
# ====================================================================

spring.datasource.url=jdbc:h2:mem:ai_interview_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# H2Dialect is auto-detected; no need to specify explicitly
# spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# Use 'none' because schema.sql creates the tables; avoid DDL conflicts
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
# Ensure JPA entity validation runs before SQL init scripts
spring.jpa.defer-datasource-initialization=true
# Disable open-in-view to prevent accidental DB queries during view rendering
spring.jpa.open-in-view=false

# SQL Initialization
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
spring.sql.init.continue-on-error=true
