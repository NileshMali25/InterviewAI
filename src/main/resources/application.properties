# ====================================================================
# AI Interview Preparation Platform - Application Configuration
# ====================================================================

spring.application.name=ai-interview-platform
server.port=${PORT:8080}

# Active profile: always defaults to 'h2' (in-memory DB) unless SPRING_PROFILES_ACTIVE is explicitly set to 'mysql'
spring.profiles.active=${SPRING_PROFILES_ACTIVE:h2}

# Static Resources
spring.web.resources.static-locations=classpath:/static/

# File upload limit if needed
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT Configuration
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# AI Service Configuration
# Supports Google Gemini API or OpenAI API
ai.provider=${AI_PROVIDER:gemini}
ai.gemini.api-key=${GEMINI_API_KEY:}
ai.gemini.model=${GEMINI_MODEL:gemini-1.5-pro}
ai.openai.api-key=${OPENAI_API_KEY:}
ai.openai.model=${OPENAI_MODEL:gpt-4o-mini}

# Fallback AI simulation mode (true when no API key provided or API unavailable)
ai.fallback-enabled=true
