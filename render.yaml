# ============================================================
# Render.com Deployment Configuration — Docker-based
# ============================================================

services:
  - type: web
    name: ai-interview-platform
    env: docker                  # Uses Dockerfile in repo root
    plan: free
    healthCheckPath: /api/questions/public
    autoDeploy: true

    envVars:
      # ── Spring Profile ────────────────────────────────────
      - key: SPRING_PROFILES_ACTIVE
        value: h2                # H2 in-memory DB (zero-config)

      # ── JWT ───────────────────────────────────────────────
      - key: JWT_SECRET
        generateValue: true      # Render auto-generates a secure random secret

      # ── Port ─────────────────────────────────────────────
      - key: PORT
        value: "8080"

      # ── AI Provider (Optional — app works without it) ────
      # Get free key: https://aistudio.google.com/app/apikey
      - key: GEMINI_API_KEY
        value: ""
